{% extends "base.html" %}

{% block title %}Лента публикаций{% endblock %}

{% block content %}
  <section class="page-intro">
    <p class="eyebrow">Лента</p>
    <h1>Публикации авторов</h1>
  </section>
  <section class="post-list">
    {% for post in posts %}
      <article class="post-card">
        <div class="post-meta">
          <span>{{ post.date }}</span>
          <a href="{% url 'blog:category_posts' post.category %}">
            {{ post.category }}
          </a>
        </div>
        <p class="post-location">{{ post.location }}</p>
        <p>{{ post.text|linebreaksbr }}</p>
        <a class="post-link" href="{% url 'blog:post_detail' post.id %}">
          Читать полностью
        </a>
      </article>
    {% endfor %}
  </section>
{% endblock %}
